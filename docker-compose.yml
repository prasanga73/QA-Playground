services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-playground-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - JWT_SECRET=qa-playground-jwt-secret-key-2024
      - JWT_REFRESH_SECRET=qa-playground-jwt-refresh-secret-key-2024
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - DB_PATH=./data/qa-playground.db
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qa-playground-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
